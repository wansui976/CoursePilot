name: Build Check

# 三端只编译、不发布：每次推送到 main / 提 PR 时确认 Windows、iOS、Android 都能编出来。
# 不需要任何签名密钥，不碰 GitHub Release；产物只作为构建附件保留几天，方便下载试装。
# 正式发布仍走 windows-release / macos-release / ios-release。

on:
  push:
    branches: [main]
    paths:
      - "course-ai/**"
      - ".github/workflows/build-check.yml"
      - ".github/scripts/**"
  pull_request:
    paths:
      - "course-ai/**"
      - ".github/workflows/build-check.yml"
      - ".github/scripts/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-check-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: 10.34.1
  NODE_VERSION: 24

jobs:
  web:
    name: Frontend (typecheck, lint, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: course-ai
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: course-ai/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit -p .
      - run: pnpm lint
      - run: pnpm test

  windows:
    name: Windows (unsigned installer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: course-ai/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: course-ai/src-tauri
      - name: Install frontend dependencies
        working-directory: course-ai
        run: pnpm install --frozen-lockfile
      - name: Prepare Windows sidecars
        shell: pwsh
        run: .\.github\scripts\prepare-windows-sidecars.ps1
      - name: Build
        working-directory: course-ai
        run: pnpm tauri build --ci
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-unsigned
          path: |
            course-ai/src-tauri/target/release/bundle/nsis/*.exe
            course-ai/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 7
      # 我们没有 Windows 机器：Rust 单测和几个原生组件在这里真跑一遍，别等用户撞上。
      # 放在上传安装包之后：测试没过时安装包照样留着，方便下载下来查。
      # release 模式复用上面 tauri build 编好的依赖；DLL（sherpa-onnx / onnxruntime / llama.cpp）
      # 都在 binaries\ 下，测试程序在 target\release\deps 里找不到，所以加进 PATH。
      - name: Rust tests (Windows)
        working-directory: course-ai/src-tauri
        shell: pwsh
        run: |
          $env:PATH = "$PWD\binaries;$PWD\target\release;$env:PATH"
          cargo test --release --lib
      - name: Smoke test llama-server (loads its DLLs)
        working-directory: course-ai/src-tauri
        shell: pwsh
        run: |
          $server = Get-ChildItem binaries -Filter "llama-server-*.exe" | Select-Object -First 1
          & $server.FullName --version
          if ($LASTEXITCODE -ne 0) { throw "llama-server failed to start: exit $LASTEXITCODE" }
      # PaddleOCR：用应用自己的下载代码从 ModelScope / Hugging Face 下模型，再认一张课件图。
      - name: Smoke test PaddleOCR (download + recognize)
        working-directory: course-ai/src-tauri
        shell: pwsh
        run: |
          $env:PATH = "$PWD\binaries;$PWD\target\release;$env:PATH"
          $env:ORT_DYLIB_PATH = "$PWD\binaries\onnxruntime.dll"
          cargo test --release --lib commands::whisper::tests::paddle_end_to_end -- --ignored --nocapture

  ios:
    name: iOS (simulator build) + Rust tests
    # 带完整 Xcode 与 iOS SDK；Rust 单测也在这里跑（build.rs 在 macOS 上要编 Swift 云同步模块）。
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # 镜像默认是 Xcode 16.4；iOS 26 的后台续跑（BGContinuedProcessingTask）只有 iOS 26 SDK 里才有，
      # 用旧 Xcode 编出来的包里没有这项功能。
      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.3.app && xcodebuild -version
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: course-ai/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: course-ai/src-tauri
      - name: Install frontend dependencies
        working-directory: course-ai
        run: pnpm install --frozen-lockfile
      - name: Restore llama-server build
        # llama-server 由 prepare-macos-sidecars.sh 从源码编（几分钟）；脚本不变就复用上次的产物，
        # 脚本见到同版本的产物和版本戳会跳过编译。
        uses: actions/cache@v4
        with:
          path: |
            course-ai/src-tauri/binaries/llama-server-*
            course-ai/src-tauri/binaries/.llama-server-*.tag
          key: llama-server-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/scripts/prepare-macos-sidecars.sh') }}

      - name: Prepare macOS sidecars
        # 与 macOS 发布用同一个脚本：在 macOS 主机上跑 Rust 测试时 tauri-build 要求 externalBin
        # 存在；同时也让每次推送都验证一遍发布脚本（下载地址失效会在这里先暴露）。
        run: ./.github/scripts/prepare-macos-sidecars.sh
      - name: Rust tests
        # rust-cache 不缓存 sherpa-onnx-sys 下载的库，缓存命中时它的构建脚本又不重跑——测试程序就找不到
        # libsherpa-onnx-c-api.dylib。删掉它的构建记录让构建脚本重跑。Rust 1.100 起构建目录改成
        # build/<包名>/<哈希>/（原来是 build/<包名>-<哈希>/），两种都要匹配。
        working-directory: course-ai/src-tauri
        run: |
          find target -type d \( -path '*/build/sherpa-onnx-sys-*' -o -path '*/build/sherpa-onnx-sys' \) -prune -exec rm -rf {} + 2>/dev/null || true
          rm -rf target/sherpa-onnx-prebuilt
          cargo test --lib
      - name: Retrieval regression (检索评测)
        # 问答检索的回归闸门：固定评测集（tests/fixtures/retrieval）对照 baseline.json，
        # 召回、「没讲到」判对、排序 MRR、噪声任一比基线差就失败，评测表写进本次运行的摘要页。
        # 上一步全量单测已经编好，这一步只跑这几条，几秒钟；全量单测失败时也照样跑，好看到数字。
        if: ${{ !cancelled() }}
        working-directory: course-ai/src-tauri
        env:
          RETRIEVAL_EVAL_SUMMARY: "1"
        run: cargo test --lib retrieval_eval -- --nocapture
      - name: Restore dav1d (AV1 decoder for on-device transcode)
        # 静态库不入库（见 .gitignore），每次按脚本编；按脚本内容缓存，脚本不变就直接复用。
        uses: actions/cache@v4
        id: dav1d-cache
        with:
          path: course-ai/src-tauri/gen/apple/vendor/dav1d/lib
          key: dav1d-${{ runner.os }}-${{ hashFiles('course-ai/scripts/build-dav1d-ios.sh') }}
      - name: Compile dav1d
        if: steps.dav1d-cache.outputs.cache-hit != 'true'
        run: |
          brew install meson ninja
          ./course-ai/scripts/build-dav1d-ios.sh
      - name: Prepare sherpa-onnx xcframework
        # 本地识别（SenseVoice / Qwen3-ASR）的 iOS 库：Xcode 规划构建时就要看到它。
        run: ./course-ai/scripts/prepare-sherpa-ios.sh
      - name: Build for iOS Simulator
        # 模拟器构建用本机临时签名，不需要证书与描述文件。
        # SHERPA_ONNX_LIB_DIR 是上面给 macOS 主机测试设的 macOS 库，iOS 交叉编译不能用；
        # rust-cache 不缓存 sherpa-onnx-sys 下载的库，删掉它的构建记录让构建脚本重跑。
        working-directory: course-ai
        run: |
          unset SHERPA_ONNX_LIB_DIR
          find src-tauri/target -type d \( -path '*/build/sherpa-onnx-sys-*' -o -path '*/build/sherpa-onnx-sys' \) -prune -exec rm -rf {} + 2>/dev/null || true
          # 它下载解压的目录也删掉：rust-cache 会把目录留下、里面的库却不在，构建脚本见目录在就不重下，接着找不到库。
          rm -rf src-tauri/target/sherpa-onnx-prebuilt
          pnpm tauri ios build --target aarch64-sim --debug --ci

  android:
    name: Android (debug APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: course-ai/pnpm-lock.yaml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Use preinstalled Android NDK
        # GitHub 的 Ubuntu 机器预装了 Android SDK 与 NDK，直接用；第三方 setup-android
        # 会重新跑 sdkmanager 装旧组件而失败。
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          echo "NDK_HOME=${ANDROID_NDK_LATEST_HOME}" >> "$GITHUB_ENV"
          echo "Using NDK at ${ANDROID_NDK_LATEST_HOME}"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: course-ai/src-tauri
      - name: Install frontend dependencies
        working-directory: course-ai
        run: pnpm install --frozen-lockfile
      - name: Build debug APK
        # rust-cache 不缓存 sherpa-onnx-sys 下载的库（本地识别用），删掉它的构建记录让构建脚本重跑、重新拷 .so。
        # Rust 1.100 起构建目录是 build/<包名>/<哈希>/（原来 build/<包名>-<哈希>/），两种都匹配。
        working-directory: course-ai
        run: |
          find src-tauri/target -type d \( -path '*/build/sherpa-onnx-sys-*' -o -path '*/build/sherpa-onnx-sys' \) -prune -exec rm -rf {} + 2>/dev/null || true
          # 它下载解压的目录也删掉：rust-cache 会把目录留下、里面的库却不在，构建脚本见目录在就不重下，接着找不到库。
          rm -rf src-tauri/target/sherpa-onnx-prebuilt
          pnpm tauri android build --debug --apk --target aarch64 --ci
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: course-ai/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
