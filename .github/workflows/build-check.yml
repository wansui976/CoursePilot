name: Build Check

# 三端只编译、不发布：每次推送到 main / 提 PR 时确认 Windows、iOS、Android 都能编出来。
# 不需要任何签名密钥，不碰 GitHub Release；产物只作为构建附件保留几天，方便下载试装。
# 正式发布仍走 windows-release / macos-release / ios-release。

on:
  push:
    branches: [main]
    paths:
      - "course-ai/**"
      - ".github/workflows/build-check.yml"
      - ".github/scripts/**"
  pull_request:
    paths:
      - "course-ai/**"
      - ".github/workflows/build-check.yml"
      - ".github/scripts/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-check-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: 10.34.1
  NODE_VERSION: 24

jobs:
  web:
    name: Frontend (typecheck, lint, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: course-ai
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: course-ai/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit -p .
      - run: pnpm lint
      - run: pnpm test

  windows:
    name: Windows (unsigned installer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: course-ai/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: course-ai/src-tauri
      - name: Install frontend dependencies
        working-directory: course-ai
        run: pnpm install --frozen-lockfile
      - name: Prepare Windows sidecars
        shell: pwsh
        run: .\.github\scripts\prepare-windows-sidecars.ps1
      - name: Build
        working-directory: course-ai
        run: pnpm tauri build --ci
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-unsigned
          path: |
            course-ai/src-tauri/target/release/bundle/nsis/*.exe
            course-ai/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 7

  ios:
    name: iOS (simulator build) + Rust tests
    # 带完整 Xcode 与 iOS SDK；Rust 单测也在这里跑（build.rs 在 macOS 上要编 Swift 云同步模块）。
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: course-ai/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: course-ai/src-tauri
      - name: Install frontend dependencies
        working-directory: course-ai
        run: pnpm install --frozen-lockfile
      - name: Restore whisper-cli build
        # whisper-cli 由 prepare-macos-sidecars.sh 从源码编（几分钟）；脚本不变就复用上次的产物，
        # 脚本见到同版本的产物和版本戳会跳过编译。
        uses: actions/cache@v4
        with:
          path: |
            course-ai/src-tauri/binaries/whisper-cli-*
            course-ai/src-tauri/binaries/.whisper-cli-*.tag
          key: whisper-cli-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/scripts/prepare-macos-sidecars.sh') }}

      - name: Prepare macOS sidecars
        # 与 macOS 发布用同一个脚本：在 macOS 主机上跑 Rust 测试时 tauri-build 要求 externalBin
        # 存在；同时也让每次推送都验证一遍发布脚本（下载地址失效会在这里先暴露）。
        run: ./.github/scripts/prepare-macos-sidecars.sh
      - name: Rust tests
        working-directory: course-ai/src-tauri
        run: cargo test --lib
      - name: Restore dav1d (AV1 decoder for on-device transcode)
        # 静态库不入库（见 .gitignore），每次按脚本编；按脚本内容缓存，脚本不变就直接复用。
        uses: actions/cache@v4
        id: dav1d-cache
        with:
          path: course-ai/src-tauri/gen/apple/vendor/dav1d/lib
          key: dav1d-${{ runner.os }}-${{ hashFiles('course-ai/scripts/build-dav1d-ios.sh') }}
      - name: Compile dav1d
        if: steps.dav1d-cache.outputs.cache-hit != 'true'
        run: |
          brew install meson ninja
          ./course-ai/scripts/build-dav1d-ios.sh
      - name: Build for iOS Simulator
        # 模拟器构建用本机临时签名，不需要证书与描述文件。
        working-directory: course-ai
        run: pnpm tauri ios build --target aarch64-sim --debug --ci

  android:
    name: Android (debug APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: course-ai/pnpm-lock.yaml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Use preinstalled Android NDK
        # GitHub 的 Ubuntu 机器预装了 Android SDK 与 NDK，直接用；第三方 setup-android
        # 会重新跑 sdkmanager 装旧组件而失败。
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          echo "NDK_HOME=${ANDROID_NDK_LATEST_HOME}" >> "$GITHUB_ENV"
          echo "Using NDK at ${ANDROID_NDK_LATEST_HOME}"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: course-ai/src-tauri
      - name: Install frontend dependencies
        working-directory: course-ai
        run: pnpm install --frozen-lockfile
      - name: Build debug APK
        working-directory: course-ai
        run: pnpm tauri android build --debug --apk --target aarch64 --ci
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: course-ai/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
