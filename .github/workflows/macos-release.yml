name: macOS Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to upload macOS assets to
        required: true
        default: v0.1.1
      arch:
        description: 要编的架构（给已发布的版本补包时只选缺的那个，别把已有的包重编覆盖掉）
        type: choice
        default: all
        options:
          - all
          - aarch64
          - x64

permissions:
  contents: write

jobs:
  # 先建好 release（带 .github/release-notes/<tag>.md 的说明），再开始漫长的构建：
  # 两个架构的构建、Windows 那边的 tauri-action 发现 release 已存在就只上传资产，不会抢着创建。
  create-release:
    name: Create or update release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME%%+*}"
          fi
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # 两个架构都在对应的原生机器上编：sidecar 脚本按 rustc 的 host 取 ffmpeg、sherpa-onnx，
      # 产物能在构建机上直接跑一遍自检。DMG 文件名自带架构（aarch64 / x64），上传不会互相覆盖。
      - name: Pick architectures
        id: matrix
        env:
          ARCH: ${{ inputs.arch || 'all' }}
        shell: bash
        run: |
          all='[{"arch":"aarch64","runner":"macos-15"},{"arch":"x64","runner":"macos-15-intel"}]'
          if [[ "$ARCH" == "all" ]]; then
            matrix="$all"
          else
            matrix="$(jq -c --arg arch "$ARCH" 'map(select(.arch == $arch))' <<<"$all")"
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          notes=".github/release-notes/${RELEASE_TAG}.md"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [[ -f "$notes" ]]; then
              gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$notes"
            fi
          elif [[ -f "$notes" ]]; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --title "CoursePilot ${RELEASE_TAG}" --notes-file "$notes" --verify-tag
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --title "CoursePilot ${RELEASE_TAG}" --generate-notes --verify-tag
          fi

  build-macos:
    name: Build macOS DMG (${{ matrix.arch }})
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.create-release.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_TAG: ${{ needs.create-release.outputs.tag }}

    steps:
      # 手动给旧版本补包时，应用代码取那个 tag，补出来的包和当初发布的是同一份代码；
      # 构建脚本仍取这次运行的提交（.github/ci 下）：旧 tag 上的脚本可能还不认新加的架构。
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Checkout build scripts
        uses: actions/checkout@v4
        with:
          path: .github/ci
          sparse-checkout: .github/scripts

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.1
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: course-ai/pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        working-directory: course-ai
        run: pnpm install --frozen-lockfile

      - name: Prepare macOS sidecars
        run: ./.github/ci/.github/scripts/prepare-macos-sidecars.sh

      - name: Build macOS bundles
        working-directory: course-ai
        run: pnpm tauri build --bundles app,dmg

      - name: Upload macOS DMG to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$RELEASE_TAG" \
            course-ai/src-tauri/target/release/bundle/dmg/course-ai_*.dmg \
            --clobber \
            --repo "$GITHUB_REPOSITORY"
