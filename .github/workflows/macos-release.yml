name: macOS Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to upload macOS assets to
        required: true
        default: v0.1.1

permissions:
  contents: write

jobs:
  # 先建好 release（带 .github/release-notes/<tag>.md 的说明），再开始漫长的构建：
  # 两个架构的构建、Windows 那边的 tauri-action 发现 release 已存在就只上传资产，不会抢着创建。
  create-release:
    name: Create or update release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME%%+*}"
          fi
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          notes=".github/release-notes/${RELEASE_TAG}.md"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [[ -f "$notes" ]]; then
              gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$notes"
            fi
          elif [[ -f "$notes" ]]; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --title "CoursePilot ${RELEASE_TAG}" --notes-file "$notes" --verify-tag
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --title "CoursePilot ${RELEASE_TAG}" --generate-notes --verify-tag
          fi

  build-macos:
    name: Build macOS DMG (${{ matrix.arch }})
    needs: create-release
    # 两个架构都在对应的原生机器上编：sidecar 脚本按 rustc 的 host 取 ffmpeg、编 whisper-cli，
    # 产物能在构建机上直接跑一遍自检。DMG 文件名自带架构（aarch64 / x64），上传不会互相覆盖。
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_TAG: ${{ needs.create-release.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.1
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: course-ai/pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        working-directory: course-ai
        run: pnpm install --frozen-lockfile

      - name: Restore whisper-cli build
        # whisper-cli 由 prepare-macos-sidecars.sh 从源码编（几分钟）；脚本不变就复用上次的产物，
        # 脚本见到同版本的产物和版本戳会跳过编译。
        uses: actions/cache@v4
        with:
          path: |
            course-ai/src-tauri/binaries/whisper-cli-*
            course-ai/src-tauri/binaries/.whisper-cli-*.tag
          key: whisper-cli-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/scripts/prepare-macos-sidecars.sh') }}

      - name: Prepare macOS sidecars
        run: ./.github/scripts/prepare-macos-sidecars.sh

      - name: Build macOS bundles
        working-directory: course-ai
        run: pnpm tauri build --bundles app,dmg

      - name: Upload macOS DMG to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$RELEASE_TAG" \
            course-ai/src-tauri/target/release/bundle/dmg/course-ai_*.dmg \
            --clobber \
            --repo "$GITHUB_REPOSITORY"
