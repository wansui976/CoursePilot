[package]
name = "course-ai"
version = "0.3.6"
description = "CourseAI Desktop"
authors = ["you"]
edition = "2021"

[lib]
name = "course_ai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
tauri-utils = { version = "2", features = ["build-2"] }

[dependencies]
anyhow = "1"
libc = "0.2"
base64 = "0.22"
# 助手里把用户贴的截图和课件页按画面比对（找出是哪一页、何时出现）。只开常见位图格式的解码。
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
chrono = { version = "0.4", features = ["serde"] }
flate2 = "1.1.9"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate", "macros", "chrono"] }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.29.0", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
which = "6"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

# 只查钥匙串条目在不在、不取密码：开发版每次重编签名都变，取密码会弹钥匙串授权框。
# 与 keyring 的 macOS 后端同一个大版本。
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"
# 本地 Whisper 认中文常吐繁体，转成简体用（只在桌面上跑 Whisper；只带繁→简词库）。
ferrous-opencc = { version = "0.4", default-features = false, features = ["t2s-conversion"] }
# 启动失败时弹原生错误框（tauri-plugin-dialog 已带进来；它的阻塞弹窗在主线程上会死锁）。
rfd = { version = "0.16", default-features = false }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std"] }
objc2-vision = { version = "0.3.2", default-features = false, features = [
  "std",
  "VNObservation",
  "VNRecognizeTextRequest",
  "VNRequest",
  "VNRequestHandler",
  "VNTypes",
  "objc2-core-foundation",
] }

[dev-dependencies]
tempfile = "3"

# 助手的截图比对要在开发版里解几百张课件图：解码库不开优化时慢十几倍（一次比对十几秒）。
# 只给这几个解码相关的依赖开优化，不影响本项目自身的编译速度。
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.zune-core]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
