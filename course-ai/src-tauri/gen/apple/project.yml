name: course-ai
options:
  bundleIdPrefix: dev.courseai.app
  deploymentTarget:
    iOS: 17.0
fileGroups: [../../src]
configs:
  debug: debug
  release: release
settingGroups:
  app:
    base:
      PRODUCT_NAME: course-ai
      PRODUCT_BUNDLE_IDENTIFIER: dev.courseai.app
      CODE_SIGN_STYLE: Automatic
      DEVELOPMENT_TEAM: D4572P92SB
targetTemplates:
  app:
    type: application
    sources:
      - path: Sources
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      groups: [app]
targets:
  course-ai_iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      - path: course-ai_iOS
      - path: assets
        buildPhase: resources
        type: folder
      - path: LaunchScreen.storyboard
    info:
      path: course-ai_iOS/Info.plist
      properties:
        LSRequiresIPhoneOS: true
        UILaunchStoryboardName: LaunchScreen
        UIRequiredDeviceCapabilities: [arm64, metal]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleShortVersionString: 0.1.4
        CFBundleVersion: "0.1.4"
        NSLocalNetworkUsageDescription: 需要访问本地开发服务器以加载课程库界面
        NSBonjourServices:
          - _http._tcp
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIBackgroundModes:
          - remote-notification
    # 不声明 iCloud / 远程推送能力：代码里没有用到（云同步走自己的传输，通知是本地的），
    # 而个人开发团队根本签不了这两项——带着它们连真机都装不上：
    #   "Personal development teams ... do not support the Push Notifications and iCloud capabilities"
    # 以后真要用 CloudKit 再往这里加回来。
    entitlements:
      path: course-ai_iOS/course-ai_iOS.entitlements
      properties: {}
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      base:
        # dav1d（AV1 软件解码）静态库：iOS 不允许 sidecar 可执行文件，只能链进来。
        # 库路径走 -L 而不是 LIBRARY_SEARCH_PATHS——下面带 [arch=...] 的条目会盖掉通用值。
        # 真机与模拟器各一份库，按 $(PLATFORM_NAME)（iphoneos / iphonesimulator）分目录。
        HEADER_SEARCH_PATHS: $(inherited) $(SRCROOT)/vendor/dav1d/include
        OTHER_LDFLAGS: $(inherited) -L$(SRCROOT)/vendor/dav1d/lib/$(PLATFORM_NAME) -ldav1d
        SWIFT_OBJC_BRIDGING_HEADER: $(SRCROOT)/Sources/course-ai/Dav1dProbe-Bridging-Header.h
        SWIFT_VERSION: "5.0"
        ENABLE_BITCODE: false
        ARCHS: [arm64]
        VALID_ARCHS: arm64 
        LIBRARY_SEARCH_PATHS[arch=x86_64]: $(inherited) $(PROJECT_DIR)/Externals/x86_64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        LIBRARY_SEARCH_PATHS[arch=arm64]: $(inherited) $(PROJECT_DIR)/Externals/arm64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: true
        EXCLUDED_ARCHS[sdk=iphoneos*]: x86_64
      groups: [app]
      configs:
        debug:
          APS_ENVIRONMENT: development
        release:
          APS_ENVIRONMENT: production
    dependencies:
      - framework: libapp.a
        embed: false
      - sdk: CoreGraphics.framework
      - sdk: CloudKit.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: Security.framework
      - sdk: UIKit.framework
      - sdk: WebKit.framework
    preBuildScripts:
      - script: pnpm tauri ios xcode-script -v --platform ${PLATFORM_DISPLAY_NAME:?} --sdk-root ${SDKROOT:?} --framework-search-paths "${FRAMEWORK_SEARCH_PATHS:?}" --header-search-paths "${HEADER_SEARCH_PATHS:?}" --gcc-preprocessor-definitions "${GCC_PREPROCESSOR_DEFINITIONS:-}" --configuration ${CONFIGURATION:?} ${FORCE_COLOR} ${ARCHS:?}
        name: Build Rust Code
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Externals/x86_64/${CONFIGURATION}/libapp.a
          - $(SRCROOT)/Externals/arm64/${CONFIGURATION}/libapp.a
